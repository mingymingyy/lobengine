name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check src tests scripts
      - name: Test
        run: python -m pytest -q
      - name: End-to-end smoke test
        run: |
          python scripts/gen_synthetic.py --events 20000
          python scripts/demo_oms.py
          python scripts/analyse_ofi.py --capture data/synthetic_okx.jsonl.gz
          python scripts/run_mm.py --runs 500
          python scripts/bench_latency.py --messages 20000
